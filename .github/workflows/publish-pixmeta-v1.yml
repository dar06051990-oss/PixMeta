name: Publish PixMeta v1.0.0 (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-pixmeta-v1.yml'
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4
      - name: Download successful Windows installer build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 43647276348 --repo "$GITHUB_REPOSITORY" --name PixMeta-Setup-v1.0.0 --dir dist
          test -s dist/PixMeta-Setup-v1.0.0.exe
          python3 -c 'from pathlib import Path; p=Path("dist/PixMeta-Setup-v1.0.0.exe"); assert p.stat().st_size>1000000; assert p.read_bytes()[:2]==b"MZ"; print("Verified Windows EXE:",p.stat().st_size,"bytes")'
      - name: Publish stable v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 dist/PixMeta-Setup-v1.0.0.exe --repo "$GITHUB_REPOSITORY" --target "0a1222c9715f39a9646fea831acf7fbe44c9d3f5" --title "PixMeta v1.0.0 — Windows image viewer" --notes-file CHANGELOG.md --latest
