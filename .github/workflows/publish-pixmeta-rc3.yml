name: Publish PixMeta RC3 installer (one time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pixmeta-rc3.yml
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download successfully tested Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh run download 43646074464 --repo "$GITHUB_REPOSITORY" --name "PixMeta-Setup-v0.5.19-RC3" --dir dist
          test -s dist/PixMeta-Setup-v0.5.19-RC3.exe
          file dist/PixMeta-Setup-v0.5.19-RC3.exe
      - name: Publish RC3 prerelease with EXE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notes.md <<'EOF'
          ## PixMeta v0.5.19 RC3 — Windows installer test build

          First installable release candidate with the approved PixMeta app icon and a self-contained Windows x64 application.

          - Install with PixMeta-Setup-v0.5.19-RC3.exe — no .NET SDK needed.
          - Start menu and optional desktop shortcuts with the approved icon.
          - Open with / Default Apps integration for supported image formats.
          - Standard uninstall through Windows.
          - Includes the existing image viewer and Forge/ComfyUI/PreviewPlus metadata support.

          The installer was built on a Windows GitHub Actions runner; compile, Inno Setup packaging, silent installation, Start menu/icon verification and silent uninstall all passed.

          **Release candidate only:** real interactive Windows use and image-viewer behavior still need user testing. Windows may show a SmartScreen warning for unsigned software.
          EOF
          gh release create v0.5.19-rc3 dist/PixMeta-Setup-v0.5.19-RC3.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PixMeta v0.5.19 RC3 — Windows installer" --notes-file /tmp/notes.md --prerelease
